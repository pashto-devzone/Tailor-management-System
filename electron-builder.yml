appId: "com.growthgrid.tailor-management-system"
productName: "Tailor Management System"

directories:
  output: dist

files:
  - "electron/**"
  - "Backend/**"
  - "Backend/.env"
  # Ship the backend's runtime environment with the embedded backend. The
  # installer is a private deployment artifact and must not be redistributed.
  - "!Backend/database/**"
  - "!Backend/**/*.log"
  - "!Backend/.env.example"

  # Frontend runtime
  - "Frontend/dist/**"
  - "Frontend/dist/index.html"

  # Minimal app package.json for production dependency resolution
  - "package.json"

# Keep backend entry and config available outside ASAR
asarUnpack:
  - "Backend/**"

win:
  artifactName: "${productName}-Setup-${version}.${ext}"
  target:
    - nsis
  icon: "electron/assets/icon.ico"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  uninstallDisplayName: "Tailor Management System"

# GitHub Releases - automatic update source
publish:
  provider: github
  owner: pashto-devzone
  repo: pashto-devzone
  releaseType: release
  vPrefixedTagName: true

extraResources:
  # Backend files
  - from: "./Backend"
    to: "Backend"
    filter:
      - "**/*"
      - ".env"
      - "!.env.example"
      - "!node_modules/.cache/**"
      - "!node_modules/nodemon/**"
      - "!database/**"
      - "!*.log"

  # Keep application icon available
  - from: "electron/assets/icon.ico"
    to: "electron/assets"
